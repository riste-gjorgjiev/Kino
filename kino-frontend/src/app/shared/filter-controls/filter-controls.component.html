<div class="filter-controls">
  <div class="filter-group">
    <label>Year From</label>
    <input
      type="number"
      min="1900"
      max="2099"
      placeholder="e.g. 2000"
      [ngModel]="filter.yearFrom"
      (ngModelChange)="onYearFromChange($event)"
    />
  </div>

  <div class="filter-group">
    <label>Year To</label>
    <input
      type="number"
      min="1900"
      max="2099"
      placeholder="e.g. 2024"
      [ngModel]="filter.yearTo"
      (ngModelChange)="onYearToChange($event)"
    />
  </div>

  <div class="filter-group">
    <label>Sort By</label>
    <select [ngModel]="filter.sortBy ?? ''" (ngModelChange)="onSortByChange($event)">
      <option value="">Default</option>
      <option value="rating">Rating</option>
      <option value="date">Date</option>
      <option value="title">Title</option>
    </select>
  </div>

  <div class="filter-group">
    <label>Order</label>
    <select [ngModel]="filter.sortOrder" (ngModelChange)="onSortOrderChange($event)">
      <option value="asc">Ascending</option>
      <option value="desc">Descending</option>
    </select>
  </div>

  <button class="clear-btn" (click)="clear()">Clear</button>
</div>
