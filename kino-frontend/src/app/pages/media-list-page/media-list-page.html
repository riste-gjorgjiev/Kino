<h1>{{ title }}</h1>

<app-filter-controls [filter]="filter" (filterChanged)="onFilterChanged($event)"></app-filter-controls>

<div class="toolbar">
  <button class="apply-btn" (click)="applyFilters()" [disabled]="loading">
    Apply Filters
  </button>

  <div class="pager">
    <button (click)="prev()" [disabled]="page === 1 || loading">
      Prev
    </button>

    <span>Page {{ page }} / {{ totalPages }}</span>

    <button (click)="next()" [disabled]="page === totalPages || loading">
      Next
    </button>
  </div>
</div>

@if (loading) {
  <div class="loading">
    <p>Loading...</p>
  </div>
} @else if (error) {
  <div class="error">
    <p>{{ error }}</p>
    <button class="retry-btn" (click)="load()">Retry</button>
  </div>
} @else if (items.length === 0) {
  <div class="empty">
    <p>No results found.</p>
    <p class="empty-hint">Try adjusting your filters or browse a different category.</p>
  </div>
} @else {
  <div class="grid">
    @for (item of items; track item.id) {
      <app-media-card [item]="item" />
    }
  </div>
}
